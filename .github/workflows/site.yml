# Build the whole site from its sources on a clean machine and publish it.
#
# Every guide and essay is built from its LaTeX with research_helpers.stack (PDF and web pages), then the
# site's own pages with build.py. Notebooks are not run here: their last run is committed in each guide's
# frozen/ folder (RH_FROZEN=1), as Quarto does with _freeze. A guide whose source is private and not
# reachable here (the Atmosphere handbook) keeps its committed pages. The result is deployed to GitHub Pages
# as an artifact, so built pages do not need to live in the repository.
name: Build and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".vscode/**"]
  pull_request:          # a proposed change is built and checked before it is merged; only main is published
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the result (untick for a test build only)"
        type: boolean
        default: true
  schedule:
    - cron: "0 5 * * 1"   # weekly rebuild: checks outside links and shows a broken toolchain before an edit needs it

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.13"   # same as the laptop, so pages match
  RH_FROZEN: "1"
  PYTHONIOENCODING: utf8

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Sources kept in other public repositories
        run: |
          mkdir -p "$HOME/dev"
          git clone --depth 1 https://github.com/GeospatialGeeks/research-helpers "$HOME/dev/research-helpers"
          git clone --depth 1 https://github.com/AhmadAmmar/sar-reading-manual "$HOME/dev/sar-reading-manual"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$HOME/dev/research-helpers" -r requirements-site.txt

      - name: Pandoc and Poppler (pdftocairo turns figure PDFs into web images)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          wget -q -O /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb

      - name: TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-medium
            collection-latexextra
            collection-fontsrecommended
            collection-xetex
            collection-bibtexextra
            latexmk
            biber

      - name: Check the toolchain
        run: python -m research_helpers.stack doctor

      - name: Build every guide, then the site
        run: python build_guides.py

      - name: Gather the published files
        run: |
          rsync -a --delete ./ _site/             --exclude '/.git*' --exclude '/_site' --exclude '/guides' --exclude '/src' --exclude '/tools' --exclude '/redirects'             --exclude '/.vscode' --exclude '/.stack-*' --exclude '__pycache__' --exclude '/*.py'             --exclude '/site.toml' --exclude '/README.md' --exclude '/requirements-site.txt' --exclude '/projects/third-pole'             --exclude '/src/pages/project-third-pole.html'
          rsync -a redirects/ _site/          # forwarding pages for renamed addresses (tools/rename_page.py)
          touch _site/.nojekyll
          du -sh _site

      - name: Check outside links (reported, never blocks publishing)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/_site" --scheme https --scheme http
            --max-concurrency 8 --timeout 20 --accept 200,202,206,403,405,429
            --exclude "marxist-economics" --exclude "127\.0\.0\.1" --exclude "github\.dev" --exclude "linkedin\.com"
            "_site/**/*.html"
          fail: false
          jobSummary: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
