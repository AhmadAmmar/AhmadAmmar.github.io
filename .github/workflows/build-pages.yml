# Rebuild the site's own pages when their sources change, so an edit made in the browser goes live on its own.
# Guides are built from LaTeX on the owner's machine (build_guides.py) and are not rebuilt here.
name: Build pages

on:
  push:
    branches: [main]
    paths:
      - "src/pages/**"
      - "site.toml"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pages
        run: python build.py
      - name: Commit the built pages if they changed
        run: |
          git config user.name "Ahmad Ammar"
          git config user.email "ahmadammargeo@gmail.com"
          git add -A -- '*.html' sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Rebuild pages after an edit"
          git push
