intro = "A first course in remote sensing and GIS as five notebooks you run yourself. Make accounts with NASA Earthdata, Copernicus and Google Earth Engine and download in bulk safely; learn what a satellite measures from Planck's law to reflectance; prepare images by clipping, reprojecting, mosaicking, masking and compositing; work with DEMs, slope, illumination and topographic correction; and turn pixels into indices, classified maps, accuracy figures and trends. All on real data from the Hunza valley in the Karakoram, with the science explained where it is used."
