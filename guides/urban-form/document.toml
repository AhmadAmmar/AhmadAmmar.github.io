intro = "Learn to read a neighbourhood from open data. Streets become a graph; buildings become density and grain; walking distance becomes access. Four places are compared step by step (Belfast, Barcelona's Eixample, Lahore's Walled City and Craigavon), with every measure explained, its limits stated, and a notebook you can point at your own street. The Urban form explorer applies the same measures to any place in your browser."
